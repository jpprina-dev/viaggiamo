services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: viaggiamo-backend-postgres
    environment:
      POSTGRES_DB: viaggiamo_db
      POSTGRES_USER: viaggiamo
      POSTGRES_PASSWORD: viaggiamo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - viaggiamo-backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viaggiamo -d viaggiamo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: viaggiamo-backend-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - viaggiamo-backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viaggiamo-backend-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - viaggiamo-backend-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  viaggiamo-backend-network:
    driver: bridge
