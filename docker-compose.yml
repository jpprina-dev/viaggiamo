services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: viaggiamo-postgres
    environment:
      POSTGRES_DB: viaggiamo_db
      POSTGRES_USER: viaggiamo
      POSTGRES_PASSWORD: viaggiamo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - viaggiamo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viaggiamo -d viaggiamo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: viaggiamo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - viaggiamo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viaggiamo-backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - viaggiamo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: viaggiamo-frontend
    environment:
      # Runtime variables
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:8000/graphql
      - NEXT_PUBLIC_GRAPHQL_URL_INTERNAL=http://backend:8000/graphql
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=Viaggiamo
      - NEXT_PUBLIC_APP_DESCRIPTION=MVP de Carpooling
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - viaggiamo-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  viaggiamo-network:
    driver: bridge
